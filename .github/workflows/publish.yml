name: publish to nuget

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./src

jobs:
  publish:
    name: pack & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: |
          dotnet pack Funogram/Funogram.fsproj \
            --configuration Release --no-restore --output ${{ runner.temp }}/nupkgs
          dotnet pack Funogram.Telegram/Funogram.Telegram.fsproj \
            --configuration Release --no-restore --output ${{ runner.temp }}/nupkgs

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: |
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
